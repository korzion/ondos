[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform = espressif32@8.0.0
board = esp32-s3-n16r8
framework = arduino
monitor_speed = 921600
platform_packages =
  platformio/toolchain-xtensa-esp-elf@15.2.0+20251204
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
