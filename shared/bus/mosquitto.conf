# Ondos broker (IF-03): Mosquitto on the station laptop, localhost only, no password.
# Every developer runs the same broker for standalone work:
#   mosquitto -c shared/bus/mosquitto.conf
# Windows: install Mosquitto as a service and point it to this file; Linux: systemd service.

per_listener_settings false
allow_anonymous true

# TCP: Python programs, GameManager and Recorder (Node.js)
listener 1883 127.0.0.1
protocol mqtt

# WebSocket: the Control Station app UI
listener 9001 127.0.0.1
protocol websockets

# Retained messages are kept in memory only; a broker restart starts clean.
persistence false
