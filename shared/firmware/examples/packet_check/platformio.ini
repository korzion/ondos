; Packet check: the ESP32 sends a PlatformState frame (IF-02, DRAFT layout) twice a second.
; On the laptop:  python -m shared.protocol.monitor COM3   (or /dev/ttyUSB0)
; If the monitor prints the values below, the ESP32 and the bridge agree on the packets.
[platformio]
default_envs = esp32-s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 921600
build_flags = -std=gnu++17 -I${PROJECT_DIR}/../../include

[env:esp32-s3]
board = esp32-s3-devkitc-1

[env:esp32-c3]
board = esp32-c3-devkitm-1
