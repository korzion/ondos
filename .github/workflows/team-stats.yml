name: Team stats page

# Rebuilds the team activity page and the issue plan page (/plan/) on every
# push to main, when an issue or pull request changes, every hour (a "blocked by"
# change sends no event), and when started by hand from the Actions tab.
# pull_request_target runs the workflow and code of main, never the code of the pull request.
on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, closed, reopened, assigned, unassigned, deleted]
  pull_request_target:
    types: [opened, edited, closed, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: team-stats-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history is needed for the statistics

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site/data
          python dashboard/collect_stats.py --out site/data/stats.json
          cp dashboard/index.html site/index.html

      - name: Collect issue plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site/plan
          python dashboard/collect_plan.py --out site/plan/data.json
          cp dashboard/plan.html site/plan/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
